<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/icons.png" type="image/x-icon">

    <script src="https://kit.fontawesome.com/4ccf7ed77e.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>CV</title>
</head>

<body>
    <div class="page-content">
        <header class="header">
            <div class="header__theme">
                <input type="checkbox" id="theme-toggler" class="theme-toggler">
                <label for="theme-toggler" class="theme-toggler__label">
                    <img src="./img/moon2.png" alt="moon2" class="fa-moon">
                </label>
            </div>
            <!-- меню -->
            <input type="checkbox" class="menu_toggler" id="menu_toggler">
            <nav class="header__nav">
                <ul class="header__list">
                    <li class="header__item"><a href="#about">about</a></li>
                    <li class="header__item"><a href="#skills">skills</a></li>
                    <li class="header__item"><a href="#projects">projects</a></li>
                    <li class="header__item"><a href="#contacts">contacts</a></li>
                </ul>
            </nav>

            <!-- menu burger -->

            <label class="menu_burger-button" for="menu_toggler">
                <span class="menu_line"></span>
            </label>

            <nav class="header__nav-burger">
                <ul class="nav__list-burger">
                    <li class="header__item"><a href="#about">about</a></li>
                    <li class="header__item"><a href="#skills">skills</a></li>
                    <li class="header__item"><a href="#projects">projects</a></li>
                    <li class="header__item"><a href="#contacts">contacts</a></li>
                </ul>
            </nav>

        </header>
        <!-- end header -->

        <!-- start main -->
         <main>
            <section class="hero">
                <div class="hero__left">
                    <p class="hero__text">Hello, I'm</p>
                    <h3 class="hero__sub-title">Alsu, junior</h3>
                    <h1 class="hero__title">front-end <br>
                        developer </h1>
                </div>
                <div class="hero__right">
                    <img src="./img/photo.png" alt="photo">
                </div>
            </section>
            <!-- end hero -->
         </main>
         <!-- end main -->
    </div>


    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
